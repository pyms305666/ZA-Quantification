name: Offline acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      QA_BROWSER: msedge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: python -m pip install -r requirements-locks/test.txt
      - run: npm ci --prefix electron
      - run: python -B tools/check_offline.py --git-only
  android-runtime:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
      - run: python -m pip install -r requirements-locks/android.txt
      - run: python -B tools/run_python38_compat.py

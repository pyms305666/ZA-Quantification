buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquopy.com/maven" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'com.chaquo.python:gradle:16.1.0'
    }
    // Chaquopy 16.1 对 AGP 声明的是宽松范围，会被解析到最新 AGP（8.13），
    // 而 Chaquopy 16.1 只兼容 8.0~8.2 的扩展 API——必须钉住版本。
    configurations.classpath {
        resolutionStrategy.force 'com.android.tools.build:gradle:8.2.2'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.zaquant.mobile'
    compileSdk 34
    defaultConfig {
        applicationId "com.zaquant.mobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.1.1"
        ndk { abiFilters "x86_64", "arm64-v8a" }
        // 注意：python 块必须放在 defaultConfig 内——
        // Chaquopy 的 createDsl 把 python 扩展挂在 android.defaultConfig 上，
        // 放在 android{} 里会报 "Could not find method python()"。
        python {
            pip { install "uvicorn==0.30.6"; install "starlette==0.38.6"; install "anyio==4.4.0";
                  install "websockets==12.0"; install "requests==2.32.3"; install "certifi";
                  install "h11==0.14.0"; install "sniffio"; install "idna"; install "click==8.1.7" }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

// release 签名配置从 keystore.properties 读取（该文件在 .gitignore，不进仓库）。
// 文件不存在时回退 debug 签名，保证 clone 后 assembleDebug / assembleRelease 都能出包。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
def hasReleaseKeystore = keystorePropsFile.exists()
if (hasReleaseKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.zaquant.mobile'
    compileSdk 34
    defaultConfig {
        applicationId "com.zaquant.mobile"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.1.3"
        ndk { abiFilters "x86_64", "arm64-v8a" }
        // 注意：python 块必须放在 defaultConfig 内——
        // Chaquopy 的 createDsl 把 python 扩展挂在 android.defaultConfig 上，
        // 放在 android{} 里会报 "Could not find method python()"。
        python {
            pip { install "uvicorn==0.30.6"; install "starlette==0.38.6"; install "anyio==4.4.0";
                  install "websockets==12.0"; install "requests==2.32.3"; install "certifi";
                  install "h11==0.14.0"; install "sniffio"; install "idna"; install "click==8.1.7";
                  install "ijson==3.2.3" }
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // minify 保持 false：Chaquopy 的 Python/Java 桥接在混淆下风险高，无混淆需求
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

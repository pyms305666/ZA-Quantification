apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

// release 签名配置从 keystore.properties 读取（该文件在 .gitignore，不进仓库）。
// Debug 无发布密钥仍可用；正式 release 缺完整生产签名配置必须失败。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def requiredSigningKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword", "certificateSha256"]
def hasReleaseKeystore = requiredSigningKeys.every { keystoreProps[it]?.trim() } &&
        file(keystoreProps["storeFile"]).isFile() &&
        keystoreProps["certificateSha256"].replace(":", "").matches("(?i)[0-9a-f]{64}")
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains("release") } && !hasReleaseKeystore) {
        throw new GradleException("Formal release requires production keystore and certificateSha256; debug is still available")
    }
}

android {
    namespace 'com.zaquant.mobile'
    compileSdk 34
    defaultConfig {
        applicationId "com.zaquant.mobile"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.2.1"
        ndk { abiFilters "x86_64", "arm64-v8a" }
        // 注意：python 块必须放在 defaultConfig 内——
        // Chaquopy 的 createDsl 把 python 扩展挂在 android.defaultConfig 上，
        // 放在 android{} 里会报 "Could not find method python()"。
        python {
            version "3.8"
            pip { install "-r", rootProject.file("../requirements-locks/android.txt").absolutePath }
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // minify 保持 false：Chaquopy 的 Python/Java 桥接在混淆下风险高，无混淆需求
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}
